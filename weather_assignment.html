```html
<!DOCTYPE html>
<head>
    <title>Weather Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35) 0 60px, transparent 61px),
                radial-gradient(circle at 85% 80%, rgba(255,255,255,0.2) 0 90px, transparent 91px),
                linear-gradient(135deg, #36d1dc, #5b86e5);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            filter: blur(2px);
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -150px;
            right: -120px;
        }

        .container {
            position: relative;
            z-index: 2;

            width: 430px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 30px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.2),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);

            text-align: center;
        }

        h1 {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;

            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
        }

        h1::before {
            content: "☀️ ";
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 15px 17px;

            border: none;
            outline: none;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.92);
            color: #263238;

            font-size: 15px;

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);

            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #8a9aa8;
        }

        input:focus {
            transform: translateY(-2px);
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.15),
                0 0 0 3px rgba(255, 255, 255, 0.35);
        }

        button {
            padding: 15px 20px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(135deg, #ffb347, #ff7b54);

            color: white;
            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 7px 18px rgba(255, 123, 84, 0.35);

            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);

            box-shadow:
                0 10px 25px rgba(255, 123, 84, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        .weather-card {
            position: relative;
            overflow: hidden;

            padding: 30px 25px;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.95),
                    rgba(240, 249, 255, 0.88)
                );

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.12);

            color: #263238;
        }

        .weather-card::before {
            content: "☁";
            position: absolute;

            font-size: 90px;
            color: rgba(91, 134, 229, 0.08);

            top: -25px;
            right: -5px;

            transform: rotate(-10deg);
        }

        .weather-card::after {
            content: "☀";
            position: absolute;

            font-size: 70px;
            color: rgba(255, 179, 71, 0.1);

            bottom: -25px;
            left: -10px;
        }

        .weather-card h2 {
            position: relative;
            z-index: 2;

            font-size: 27px;
            margin-bottom: 15px;

            color: #174a7c;

            text-transform: capitalize;
        }

        .temperature {
            position: relative;
            z-index: 2;

            font-size: 64px;
            font-weight: 800;

            margin: 10px 0;

            background: linear-gradient(135deg, #1565c0, #42a5f5);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #condition {
            position: relative;
            z-index: 2;

            color: #607d8b;

            font-size: 17px;
            font-weight: 600;

            margin-bottom: 25px;
        }

        #condition::before {
            content: "🌤️ ";
        }

        .details {
            position: relative;
            z-index: 2;

            border-top: 1px solid rgba(100, 140, 170, 0.2);

            padding-top: 18px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .details p {
            margin: 0;

            padding: 15px 10px;

            border-radius: 15px;

            background: rgba(235, 246, 255, 0.85);

            color: #607d8b;

            font-size: 14px;
            font-weight: 600;

            box-shadow:
                0 5px 12px rgba(40, 100, 150, 0.06);

            transition: all 0.3s ease;
        }

        .details p:hover {
            transform: translateY(-3px);

            background: rgba(220, 241, 255, 0.95);
        }

        .details p:first-child::before {
            content: "💨";
            display: block;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .details p:last-child::before {
            content: "🌡️";
            display: block;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .details span {
            display: block;

            margin-top: 5px;

            color: #1565c0;

            font-size: 16px;
            font-weight: 700;
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .container {
                width: 100%;
                padding: 25px 18px;
                border-radius: 25px;
            }

            h1 {
                font-size: 27px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .weather-card {
                padding: 25px 18px;
            }

            .temperature {
                font-size: 55px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Dashboard</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter the city name">
            <button onclick="getWeather()">Search</button>
        </div>
        <div id="weatherCard" class="weather-card">
            <h2 id="cityName">City</h2>
            <div class="temperature">
                <span id="temperature">--</span> °C
            </div>
            <p id="condition">Weather Condition</p>
            <div class="details">
                <p>Wind Speed: <span id="wind">--</span></p>
                <p>Temperature: <span id="temp">--</span> °C</p>
            </div>
        </div>
    </div>
    <script src="weather_api.js"></script>
</body>
</html>
